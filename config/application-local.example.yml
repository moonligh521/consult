# 复制本文件为同目录 application-local.yml 后填真实地址和密钥。
# application-local.yml 已在 .gitignore，不要 git add。
#
# 仓库里的 application.yml 只放可公开的写死默认值，方便迁 Nacos。
# 数据库密码、Redis 密码、模型密钥、JWT 只写本文件。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/consult_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sessionVariables=innodb_lock_wait_timeout=5
    username: root
    password: "replace-with-db-password"
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: "replace-with-redis-password"
model:
  api-key: "replace-with-deepseek-key"
consult:
  auth:
    jwt-secret: "replace-with-jwt-secret"
    internal-token: "replace-with-internal-token"
    admin-password: "replace-with-admin-password"
  xxl:
    enabled: false
    admin-addresses: http://127.0.0.1:18080
    access-token: "replace-with-xxl-token"
