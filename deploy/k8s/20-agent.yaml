# 挂号咨询服务：1000 并发的主力。瓶颈在模型并发，不在 CPU，所以：
#   - 单副本模型上限（舱壁）× 最少副本数 ≥ 全局配额，保证最少副本时也能用满配额；
#   - 全局配额（Redisson）按 DeepSeek 账号并发限额配，副本扩到再多也不会超；
#   - HPA 按 CPU 扩，扩容主要为了分摊请求处理和 JSON/规则计算，模型吞吐由全局配额决定。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consult-agent
  namespace: consult
spec:
  replicas: 4
  selector:
    matchLabels: { app: consult-agent }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: consult-agent }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "18081"
        prometheus.io/path: /actuator/prometheus
    spec:
      # 优雅停机 30s + preStop 10s
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: consult-agent }
      containers:
        - name: app
          image: registry.example.com/consult/consult-agent:latest
          ports:
            - containerPort: 18081
          envFrom:
            - configMapRef: { name: consult-common }
            - secretRef: { name: consult-secrets }
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):3306/consult_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sessionVariables=innodb_lock_wait_timeout=5"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: consult-secrets, key: MYSQL_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: consult-secrets, key: MYSQL_PASSWORD } }
            - { name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: "30" }
            - { name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE, value: "10" }
            - { name: SPRING_DATA_REDIS_HOST, value: "$(REDIS_HOST)" }
            - { name: SPRING_DATA_REDIS_PORT, value: "$(REDIS_PORT)" }
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: consult-secrets, key: REDIS_PASSWORD } }
            # 8 秒会让 Redis 抖动把在途请求一起挂住
            - { name: SPRING_DATA_REDIS_TIMEOUT, value: 1s }
            - name: CONSULT_AUTH_JWT_SECRET
              valueFrom: { secretKeyRef: { name: consult-secrets, key: AUTH_JWT_SECRET } }
            - name: CONSULT_AUTH_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: consult-secrets, key: AUTH_INTERNAL_TOKEN } }
            - name: MODEL_API_KEY
              valueFrom: { secretKeyRef: { name: consult-secrets, key: DEEPSEEK_API_KEY } }
            - { name: CONSULT_IDENTITY_BASE_URL, value: "http://consult-identity:18082" }
            - { name: CONSULT_IDENTITY_MAX_CONCURRENCY, value: "100" }
            - { name: CONSULT_CATALOG_PROVISION_DEMO, value: "false" }
            - { name: CONSULT_OBSERVABILITY_CAPTURE_PAYLOADS, value: "false" }
            - { name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY, value: "0.1" }
            # 全局配额按供应商账号限额；单副本上限 × 最少 4 副本要盖住全局配额
            - { name: MODEL_SAFETY_GLOBAL_MAX_CONCURRENCY, value: "600" }
            - { name: MODEL_SAFETY_MAX_CONCURRENCY, value: "200" }
            - { name: MODEL_COMPLAINT_GLOBAL_MAX_CONCURRENCY, value: "400" }
            - { name: MODEL_COMPLAINT_MAX_CONCURRENCY, value: "130" }
            - { name: CONSULT_REDISSON_POOL_SIZE, value: "64" }
            - { name: CONSULT_REDISSON_TIMEOUT, value: 1s }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 2Gi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 18081 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 18081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 18081 }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 10"] }
---
apiVersion: v1
kind: Service
metadata:
  name: consult-agent
  namespace: consult
spec:
  selector: { app: consult-agent }
  ports:
    - port: 18081
      targetPort: 18081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consult-agent
  namespace: consult
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: consult-agent }
  minReplicas: 4
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    # 早高峰来得快：扩容不等待；缩容等 10 分钟，避免高峰中途来回抖
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 600
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consult-agent
  namespace: consult
spec:
  minAvailable: 3
  selector:
    matchLabels: { app: consult-agent }
