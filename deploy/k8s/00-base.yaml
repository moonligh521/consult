# 命名空间、公共配置、密钥。密钥这里只放占位，生产用 External Secrets / 云 KMS 注入，不要把真值提交进仓库。
apiVersion: v1
kind: Namespace
metadata:
  name: consult
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: consult-common
  namespace: consult
data:
  SPRING_PROFILES_ACTIVE: prod
  # MySQL 8：max_connections 至少 1000（挂号 12×30 + 身份 6×20 + 运维余量），innodb_buffer_pool_size 给到内存 60%~70%
  MYSQL_HOST: mysql.consult-infra.svc
  # Redis 主从 + 哨兵或云 Redis 主备版；哨兵/集群模式给挂号服务挂 REDISSON_CONFIG_FILE
  REDIS_HOST: redis.consult-infra.svc
  REDIS_PORT: "6379"
  VIRTUAL_THREADS: "true"
  # 必须为空：非空时这个固定码对任何手机号都能登录。只有压测环境才设成 000000
  AUTH_SMS_DEV_CODE: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: consult-secrets
  namespace: consult
type: Opaque
stringData:
  MYSQL_USER: consult
  MYSQL_PASSWORD: change-me
  REDIS_PASSWORD: change-me
  AUTH_JWT_SECRET: change-me-to-32-bytes-or-longer-secret
  AUTH_INTERNAL_TOKEN: change-me
  DEEPSEEK_API_KEY: change-me
  AUTH_ADMIN_PASSWORD: change-me
