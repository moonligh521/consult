spring:
  application:
    name: consult-registration-agent-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/consult_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 18081
safety:
  catalog:
    location: classpath:safety/urgent-catalog.json
    draft-mode: SHADOW
  model:
    enabled: false
    timeout-ms: 3000
    invalid-output-retries: 1
    max-concurrency: 20
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model-name: deepseek-chat
