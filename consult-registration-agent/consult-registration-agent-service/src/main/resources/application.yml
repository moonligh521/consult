spring:
  application:
    name: consult-registration-agent-service
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:./consult-registration-agent/consult-registration-agent-service/config/application-local.yml
      - optional:file:../../config/application-local.yml
  # 请求线程用虚拟线程：等模型、等身份服务时不占平台线程。并发闸门在连接池和模型信号量上。
  threads:
    virtual:
      enabled: true
  lifecycle:
    # 最坏链路含安全模型重试，以及主诉超时重试后再遇一次无效输出重试
    timeout-per-shutdown-phase: 110s
  datasource:
    # 行锁最多等 5 秒就报错，不让同一会话的并发请求排成长队拖住连接；批量写决策改写成多值 INSERT
    # 真实库地址和密码只写 gitignore 的 application-local.yml，本文件不放生产密钥。
    url: jdbc:mysql://127.0.0.1:3306/consult_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&sessionVariables=innodb_lock_wait_timeout=5
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 实例数 × 本值 + 身份服务连接数，要小于 MySQL max_connections 并留余量
      maximum-pool-size: 30
      minimum-idle: 10
      # 拿不到连接 3 秒就失败，别让请求在池子前排 30 秒把整个实例拖死
      connection-timeout: 3000
      connection-init-sql: SET time_zone = '+08:00'
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      timeout: 8s
department:
  cache:
    redis-key: consult:dept:catalog:v2
    ttl-seconds: 600
    local-ttl-ms: 30000
    double-delete-delay-ms: 1000
server:
  port: 18081
  # 滚动发布时先摘流量再停：由 spring.lifecycle 的 110 秒预算覆盖完整模型重试与收尾
  shutdown: graceful
  tomcat:
    # 虚拟线程下线程数不是瓶颈，连接数要盖住网关到单实例的峰值长连接
    max-connections: 10000
    accept-count: 500
    connection-timeout: 5s
safety:
  catalog:
    location: classpath:safety/urgent-catalog.json
    draft-mode: SHADOW
model:
  api-key: ""
  # 压测时指向 loadtest/wiremock 模拟的模型，避免压测流量打到真实账号
  base-url: https://api.deepseek.com
  model-name: deepseek-v4-flash
  cache-ttl-hours: 168
  # max-concurrency 是单实例上限（舱壁）；global-max-concurrency 是全部实例合计（Redisson 配额），按供应商账号并发限额配，0 不启用
  safety:
    timeout-ms: 2500
    max-concurrency: 32
    global-max-concurrency: 0
    acquire-wait-ms: 1500
    invalid-output-retries: 1
    timeout-retries: 1
  complaint:
    timeout-ms: 30000
    max-concurrency: 32
    global-max-concurrency: 0
    acquire-wait-ms: 800
    invalid-output-retries: 1
    timeout-retries: 1
inquiry:
  closed: false
  # 本档医生满员先排队；队头等超过该时间只提一档。扫描走 XXL matchUpgradeJob。
  # 未派已支付对账走 XXL matchReconcileJob（建议 10～30 秒一拍）。
  match-upgrade-after: 1m
management:
  tracing:
    export:
      enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://117.72.43.169:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # /actuator/health/liveness 与 /readiness 给 K8s 探针用；停机时 readiness 先变 DOWN 再停
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
consult:
  observability:
    enabled: true
    capture-payloads: true
    langfuse:
      public-url: http://117.72.43.169:3000
      project-id: consult-agent
      retention-days: 30
      public-key: ""
      secret-key: ""
    judge:
      enabled: false
      phase: bootstrap
      since-minutes: 180
      interval-ms: 900000
      max-observations: 500
  redisson:
    enabled: true
    # 哨兵/集群时指向 Redisson YAML；为空用上面 spring.data.redis 单机地址
    config-file: ""
    timeout: 1s
    pool-size: 64
  guard:
    # 盖住主诉超时重试。锁不续期，短于模型最坏耗时时第二笔会在旧副本上预演。
    lease: 75s
  catalog:
    provision-demo: true
  auth:
    jwt-secret: consult-dev-jwt-secret-key-32bytes!
    jwt-ttl-hours: 168
    internal-token: consult-internal
  pay:
    # 独立支付服务。商户号和证书写在 consult-payment 的配置里，这里只留调用地址和同一把 X-Pay-Token。
    base-url: http://127.0.0.1:18083
    token: ""
    callback-url: http://127.0.0.1:18081/api/pay/callback
  benefit:
    # 独立权益服务。令牌为空则下单不查额度，按目录实付价支付。
    base-url: http://127.0.0.1:18084
    token: ""
  identity:
    base-url: http://127.0.0.1:18082
    # 单实例同时打身份服务的上限（Resilience4j 舱壁）
    max-concurrency: 200
    max-wait: 200ms
  # 问诊订单同步医生端。NameServer 与 MySQL 同一台机器，端口 9876。
  mq:
    enabled: true
  # 执行器。admin-addresses 写调度中心根地址，不要加 /xxl-job-admin。
  xxl:
    enabled: false
    admin-addresses: http://127.0.0.1:18080
    appname: consult-registration-agent
    ip: ""
    port: 19998
    access-token: ""
    log-path: ./logs/xxl-job
    log-retention-days: 30
# 与 datasource 的 127.0.0.1 同一台中间件。配了 name-server 才创建 RocketMQTemplate / ConsultMqSender。
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: consult-registration-agent-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
