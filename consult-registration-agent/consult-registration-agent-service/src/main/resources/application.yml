spring:
  application:
    name: consult-registration-agent-service
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:./consult-registration-agent/consult-registration-agent-service/config/application-local.yml
      - optional:file:../../config/application-local.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/consult_agent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
department:
  cache:
    redis-key: consult:dept:catalog
    ttl-seconds: 600
    local-ttl-ms: 30000
    double-delete-delay-ms: 1000
server:
  port: 18081
safety:
  catalog:
    location: classpath:safety/urgent-catalog.json
    draft-mode: SHADOW
model:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model-name: deepseek-v4-flash
  cache-ttl-hours: 168
  safety:
    timeout-ms: 2500
    max-concurrency: 32
    acquire-wait-ms: 50
    invalid-output-retries: 1
  complaint:
    timeout-ms: 2000
    max-concurrency: 32
    acquire-wait-ms: 50
    invalid-output-retries: 0
inquiry:
  closed: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
consult:
  catalog:
    provision-demo: true
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:consult-dev-jwt-secret-key-32bytes!}
    jwt-ttl-hours: 168
  identity:
    base-url: http://127.0.0.1:18082
    internal-token: ${AUTH_INTERNAL_TOKEN:consult-internal}
