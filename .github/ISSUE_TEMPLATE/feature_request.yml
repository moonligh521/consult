name: 建议
description: 提出一个功能或改动建议
title: "功能: "
labels: ["enhancement"]
body:
  - type: input
    id: version
    attributes:
      label: 目标版本
      description: 写成 V主.次，例如 V0.1。对应开发分支是 feature-V0.1-年月日。
      placeholder: V0.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在缺了什么，谁会遇到
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 还考虑过什么
    validations:
      required: false
