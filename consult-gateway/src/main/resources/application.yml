spring:
  application:
    name: consult-gateway
  main:
    web-application-type: reactive
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:../../config/application-local.yml
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      # 限流每个请求都要访问一次 Redis，超时要短；超时后过滤器自动退回本实例内存桶
      timeout: 300ms
      connect-timeout: 1s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            # 盖住一次咨询消息最坏耗时（模型排队 + 安全模型重试 + 主诉模型），超过就 504
            response-timeout: 15s
            pool:
              type: fixed
              max-connections: 2000
              acquire-timeout: 2000
              max-idle-time: 30s
              max-life-time: 5m
              metrics: true
server:
  port: 8080
  shutdown: graceful
management:
  # 指标与探针走内部端口，不经网关对外暴露
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
consult:
  auth:
    jwt-secret: consult-dev-jwt-secret-key-32bytes!
    jwt-ttl-hours: 168
  gateway:
    identity-uri: http://127.0.0.1:18082
    agent-uri: http://127.0.0.1:18081
    # 单实例在途请求上限，超出 503；按 网关实例数 × 本值 ≥ 目标峰值并发 × 1.5 配
    max-in-flight: 4000
    # 前面有 SLB / Ingress 时设为代理层数，限流按真实客户端 IP
    trusted-proxy-hops: 0
    rate-limit:
      enabled: true
      # 默认档：按账号，未登录按 IP
      per-second: 5
      burst: 20
      rules:
        # 发验证码：按 IP 防短信轰炸（按手机号的频控在身份服务）。同一出口 IP 下人多时调大
        - name: sms
          paths: [/api/auth/sms]
          key-by: IP
          per-second: 2
          burst: 10
        # 登录：按 IP 防撞库
        - name: login
          paths: [/api/auth/login, /api/admin/login]
          key-by: IP
          per-second: 5
          burst: 20
        # 咨询写操作：每次都可能调模型、派医生，最贵，按账号收紧
        - name: consult-write
          paths: [/api/consultations/**]
          methods: [POST, PUT, PATCH]
          key-by: ACCOUNT
          per-second: 2
          burst: 10
